# CI — see docs/adr/0015-plataforma-y-ci.md
#
# Every step mirrors a root package.json script so any CI failure is
# reproducible locally with the same command.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    # Style/type checks are OS-independent — one cell is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # docs:check reads the pushed commits
      - uses: pnpm/action-setup@v6
        # version intentionally omitted: read from the root "packageManager" field
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm docs:check
      # Backstop for the local commit-msg hook: code, tests and docs change together.
      - name: Check pushed commits follow docs/process.md
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/check-docs.mjs --range "${{ github.event.before }}..${{ github.sha }}"
      - name: Check PR commits follow docs/process.md
        if: github.event_name == 'pull_request'
        run: node scripts/check-docs.mjs --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      # Build before typecheck: help/mcp/completions resolve @runa-cmd/core
      # types from its dist/ (workspace dep) — a fresh checkout has no dist.
      - run: pnpm build
      - run: pnpm typecheck

  test:
    strategy:
      # An OS-specific failure must not mask a failure in another cell.
      fail-fast: false
      # Node 24 baseline (ADR-0015). Matrix syntax kept so new Node versions are
      # a one-line addition.
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generated completion scripts run in the real shells. Linux only: one OS
      # is enough to prove the scripts, and bash is already there.
      - name: Install the shells completions are tested in
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      # Build before test: packages consume each other's dist/ via workspace deps.
      - run: pnpm build
      - run: pnpm test
        env:
          RUNA_REQUIRE_SHELLS: ${{ runner.os == 'Linux' && '1' || '' }}

  coverage:
    # Single canonical coverage cell (ADR-0015). The threshold lives in
    # packages/core/vitest.config.ts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
